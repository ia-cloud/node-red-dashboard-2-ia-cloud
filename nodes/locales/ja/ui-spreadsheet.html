<script type="text/x-red" data-help-name="ui-spreadsheet-2" data-lang="ja">
	<p>このノードは、ダッシュボードにia-cloudのAlarm&amp;Eventモデルデータを集計してテーブル(表)を表示するノードです。</p>
    <h3>入力メッセージ</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>
            「データ取得V2(標準)II」の形式のデータを入力します。
        </dd>
    </dl>
    <h3>詳細説明</h3>
    <p>このノードは入力データを集計し、表形式に変換して表示します。</p>
    <ul>
        <li><code>Alarm&amp;Event</code>：ia-cloud の Alarm&amp;Event モデルデータを対象に集計します。</li>
        <li><code>ステータス</code>：指定したステータスのデータを集計対象とします。</li>
        <li><code>表示項目</code>：No / 詳細 / 回数 の表示内容を切り替えます。</li>
    </ul>

    <p>表示項目の設定により、以下の形式で表示します。</p>
    <ul>
        <li><code>A&E No，A&E詳細</code>：No、詳細、回数 を表示します。</li>
        <li><code>A&E No</code>：No、回数 を表示します。</li>
        <li><code>A&E詳細</code>：詳細、回数 を表示します。</li>
    </ul>

    <p>本ノードはia-cloud アラーム&イベントモデルデータを集計対象としており、その他のモデルデータの集計には対応していません。</p>
</script>
