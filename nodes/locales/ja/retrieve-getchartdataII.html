<script type="text/x-red" data-help-name="retrieve-getchartdataII" data-lang="ja">
	<p>このノードは、ia-cloud V2 のCCS接続設定を使用して、指定したobjectKeyのia-cloudオブジェクトを取得し、必要に応じてアグリゲーション処理と表示桁数の丸め処理を行ったうえで、chartノードへ入力する際の形に変換して出力するノードです。</p>

	<h3>出力メッセージ</h3>
	<dl class="message-properties">
		<dt>payload <span class="property-type">object</span></dt>
		<dd>取得したiacloudオブジェクトをdashborad - chartへ入力する際の形に変換した結果（json形式）。</dd>
	</dl>

	<h3>出力データ形式</h3>
	<p>出力形式は設定内容により異なります。</p>

	<h4>1. Node-RED Dashboard 形式</h4>
	<p><code>[{ series:[...], data:[...], labels:[...] }]</code> 形式で出力します。</p>

	<pre><code>{
		"payload": [
		{
			"series": ["温度", "圧力"],
			"data": [
			[
			{ "x": "2026-04-01T08:00:00+09:00", "y": 12.3 },
			{ "x": "2026-04-01T09:00:00+09:00", "y": 13.1 }
			],
			[
			{ "x": "2026-04-01T08:00:00+09:00", "y": 45.6 },
			{ "x": "2026-04-01T09:00:00+09:00", "y": 46.2 }
			]
			],
			"labels": [""]
		}
		]
	}</code></pre>

	<h4>2. Node-RED Dashboard2.0 形式</h4>
	<p><code>{ series, x, y }</code> の配列で出力します。</p>

	<pre><code>{
		"payload": [
		{ "series": "温度", "x": "2026-04-01T08:00:00+09:00", "y": 12.3 },
		{ "series": "温度", "x": "2026-04-01T09:00:00+09:00", "y": 13.1 }
		]
	}</code></pre>

	<h3>詳細説明</h3>
	<p>データ取得は CCS接続ノード経由で <code>retrieveArray</code> を実行します。</p>
	<p>期間指定は以下の2通りです。</p>
	<ul>
		<li>日付設定ノードから開始日時・終了日時を入力する</li>
		<li>ノード設定内で開始日時・終了日時を指定する</li>
	</ul>

	<p>取得時には、取得件数と期間を指定できます。開始日時と終了日時の両方を指定した場合、開始日時が終了日時以下のときのみ取得を実行します。</p>
	<p>取得結果に対して、必要に応じて以下の処理を行えます。</p>
	<ul>
		<li>アグリゲーション（設定内容に応じた集計処理）</li>
		<li>表示桁数の丸め</li>
		<li>表示名への置き換え</li>
	</ul>

	<p>出力対象は、設定したdataNameに一致する項目です。表示名が設定されている場合は、その名称を優先して出力します。</p>
	<p>取得データが存在しない場合は、設定した出力形式に応じた空データを返します。</p>

	<p>最大取得データ件数は1000件で、未設定の場合1000件取得します。</p>

	<p><b>注</b>: 本ノードを使用するには、ia-cloud V2の接続先CCS設定（DynamoDB操作ユーザの情報）が必要です。</p>
	<p>ユーザ情報は別途発行・取得する必要があります。</p>
</script>
